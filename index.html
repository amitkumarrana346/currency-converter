
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currency Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>💱 Currency Converter</h2>

        <form id="converter-form">

            <div class="amount">
                <p>Enter Amount</p>
                <input type="number" id="amount" value="1" min="0.01" step="any" required>
            </div>

            <div class="dropdown">

                <div class="from">
                    <p>From</p>

                    <div class="select-container">
                        <span id="from-flag">🇺🇸</span>

                        <select id="from-currency">
                            <option value="USD" selected>USD</option>
                            <option value="INR">INR</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="JPY">JPY</option>
                            <option value="AUD">AUD</option>
                            <option value="CAD">CAD</option>
                            <option value="AED">AED</option>
                            <option value="SGD">SGD</option>
                            <option value="CNY">CNY</option>
                        </select>
                    </div>
                </div>

                <button type="button" id="swap-button" title="Swap currencies">
                    ⇄
                </button>

                <div class="to">
                    <p>To</p>

                    <div class="select-container">
                        <span id="to-flag">🇮🇳</span>

                        <select id="to-currency">
                            <option value="USD">USD</option>
                            <option value="INR" selected>INR</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="JPY">JPY</option>
                            <option value="AUD">AUD</option>
                            <option value="CAD">CAD</option>
                            <option value="AED">AED</option>
                            <option value="SGD">SGD</option>
                            <option value="CNY">CNY</option>
                        </select>
                    </div>
                </div>

            </div>

            <div class="result-box">
                <p id="result">Enter an amount and click Convert.</p>
                <p id="rate-info"></p>
            </div>

            <button type="submit" id="convert-button">
                Get Exchange Rate
            </button>

            <p id="error-message"></p>

        </form>

        <p class="footer">Simple • Fast • Easy</p>

    </div>

    <script src="app.js"></script>

</body>
</html>
